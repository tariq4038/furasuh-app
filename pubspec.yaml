name: app
description: "Furasuh Store App"
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  easy_localization: ^3.0.1
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.0
  webview_windows: ^0.4.0
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/furasuh_adaptive_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/furasuh_adaptive_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/furasuh_adaptive_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icon/furasuh_adaptive_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/furasuh_adaptive_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/langs/en-US.json
    - assets/langs/ar-SA.json
